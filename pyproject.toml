[project]
name = "demand-forecact"
version = "0.1.0"
description = "Прогнозирование спроса на продукцию собственного производства с малым сроком годности"
readme = "README.md"
authors = [
    { name = "Natasha Kolesnik", email = "knv080980@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mlflow>=3.16.1",
    "pandas>=3.0.6",
    "prefect>=3.8.6",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[tool.uv]
# Проект — набор скриптов (main.py + src/lib/), а не устанавливаемый пакет,
# поэтому uv его не собирает: нет ни build-system, ни src/demand_forecact/.
package = false
