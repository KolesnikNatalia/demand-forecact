# Параметры анализа рядов «магазин × товар»
# (PRD prd/prd-store-item-time-series-analysis.md, план prd/plan-store-item-time-series-analysis.md).
#
# Здесь лежит всё, что задаёт прогон анализа: период, пороги, границы классов.
# Ни одна дата и ни один порог не зашиты в код — прогон на другой выгрузке
# меняет только этот файл. Пути сюда не входят: они в config.yaml.
# Следующие этапы дописывают свои разделы в этот же файл.
#
# Читает файл src/lib/params.py; шаг берёт свой раздел через profile.section(),
# и опечатка в имени ключа роняет прогон, а не даёт значение по умолчанию.

# Период выгрузки, оба конца включительно.
period:
  start: 2025-01-01
  end: 2026-08-31

# Когорта пары — по дате её первой активности (первая продажа или ненулевой остаток):
# «до» или «после» этой даты. 2026-05-19 — день, когда матрицу расширили на бумаге
# (docs/data.md, разд. 6). Решение рабочее, пересмотрят по результатам.
cohort:
  date: 2026-05-19

# Что входит в основные итоги отчёта.
scope:
  # Подгруппы, по которым не решено, относятся ли они к задаче (docs/project.md, разд. 7).
  # В сводках идут отдельной строкой и в основные итоги не входят.
  disputed_subgroups:
    - ПОЛУФАБРИКАТЫ ЗАМОРОЖЕННЫЕ
    - ЗАПРЕЩЕННЫЕ
    - УПАКОВКА
    - НАПИТКИ
    - 'ПОЛУФАБРИКАТЫ ЛАПША, ПАСТА'
  # Магазины, выбивающиеся из общей массы: в задачу входят все магазины, но в сводках
  # по магазинам, сетям и форматам такие видны отдельной строкой.
  outlier_stores:
    revenue_below_mln: 1.0  # выручка собственного производства за весь период, млн руб.

# Единица измерения → ветка расчёта. `кг` и `шт` — разные распределения, в одну цифру
# не сводятся. Единицы, которой здесь нет, в данных быть не должно: это ошибка.
branches:
  кг: [кг]
  шт: [шт]

# Возвраты (SalesQty < 0) — это продажи прошлых дней, а не спрос дня.
# `zero` — обнулить продажи и выручку строки, саму строку оставить (остаток и матрица
# в ней верные). Других режимов шаг не поддерживает.
returns: zero

# Наличие товара: остаток не ниже порога. Дефицит: матричный день с остатком ниже порога.
# Порог рабочий, заказчик не утверждал: 100 г салата ещё купят, меньше — отходы.
stock_threshold:
  шт: 1
  кг: 0.1

# Жизнь пары — от первой до последней активности (`active_span`). Матричные дни вне
# этого отрезка — пропуски, как дни вне матрицы. Других режимов шаг не поддерживает.
life: active_span
