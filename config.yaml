# Общие параметры проекта. Секреты сюда не писать — они в .env (шаблон — .env.example).
# Читает только src/lib/settings.py; остальной код берёт готовые значения из него.

paths:
  # Корень данных. Относительный путь считается от корня проекта, абсолютный берётся как есть.
  # Переменная окружения DF_DATA_DIR переопределяет значение (например, на сервере).
  data: data

  # Каталоги слоёв — внутри корня данных (абсолютный путь берётся как есть)
  layers:
    main_data: main_data   # сырые факты: main_data_YYYY_MM.parquet
    prepared: prepared     # плотная сетка, очистка, ветки кг/шт, флаг дефицита
    features: features     # признаки на момент расчёта заказа
    forecast: forecast     # прогнозы и заказ
    analysis: analysis     # результаты анализа рядов: профиль пар, меры, сводные таблицы
    checks: checks         # результаты проверок качества данных
    tmp: tmp               # только файлы SQL-команд; данные шага — в каталоге своего слоя

  # Логи — от корня проекта
  logs: logs

  # Отчёты анализа — от корня проекта: они лежат в git рядом с остальной документацией,
  # а не в data/ (та в .gitignore). Имя файла задаёт шаг отчёта, здесь только каталог.
  docs: docs
